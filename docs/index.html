<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adventure Lab Ops</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AL Ops">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" id="tcL" content="#F7F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" id="tcD" content="#1E1C18" media="(prefers-color-scheme: dark)">
<script>
/* Apariencia (por dispositivo): 'auto' (sigue al teléfono) | 'light' | 'dark'. Se aplica antes de pintar, para que no parpadee. */
(function(){
  var K='adv_ops_theme',C={light:'#F7F3EC',dark:'#1E1C18'};
  window.getTheme=function(){var m='auto';try{m=localStorage.getItem(K)||'auto'}catch(e){}return m==='light'||m==='dark'?m:'auto'};
  window.applyTheme=function(m){
    var h=document.documentElement,l=document.getElementById('tcL'),d=document.getElementById('tcD');
    if(m==='light'||m==='dark')h.setAttribute('data-theme',m);else h.removeAttribute('data-theme');
    if(l&&d){
      if(m==='light'||m==='dark'){l.content=d.content=C[m];l.removeAttribute('media');d.removeAttribute('media')}
      else{l.content=C.light;d.content=C.dark;l.setAttribute('media','(prefers-color-scheme: light)');d.setAttribute('media','(prefers-color-scheme: dark)')}
    }
  };
  window.setTheme=function(m){try{if(m==='auto')localStorage.removeItem(K);else localStorage.setItem(K,m)}catch(e){}window.applyTheme(m)};
  window.applyTheme(window.getTheme());
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* reset that the claude.ai page skeleton used to provide */
[hidden]{display:none!important}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
</style>
<style>
/* Design system "Arena · salvia" (round 8). Flat lists on paper (full-width rows, hairlines, no cards), sand page, one salvia accent, serif for titles and tour names.
   Type: 4 sizes only — 26 title · 16 name · 14 body · 12 small (+ 11 for "neto" under bruto, + 22 for the few big figures). Weights 400/500 only. Spacing in multiples of 4.
   Tokens are CSS variables: light + dark. Status colours (green / warning / error / neutral) keep their meaning in both themes; only their lightness changes in dark. */
:root{
  --sand:#F7F3EC; --paper:#FFFDF8; --paper2:#FBF8F2; --hair:#EAE2D4; --sep2:#F0E9DC; --rule:#DCD2C0;
  --ink:#2B2620; --ink2:#7A6F60; --ink3:#9C9183;
  --acc:#3E4A3D; --acc-ink:#F7F3EC; --acc-soft:#E6ECE2; --fill:#EFE9DD;
  --green:#3E6B48; --dotg:#5C8A5F; --orange:#A8742A; --red:#B5532F; --neutral:#D6CCBB; --badge:#B5532F;
  --scrim:rgba(43,38,32,.34);
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --px:max(16px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));
  --ground:var(--sand); --row:var(--paper); --sep:var(--hair); --yellow:var(--orange);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sand:#1E1C18; --paper:#2A2722; --paper2:#25221E; --hair:#3A352E; --sep2:#322E28; --rule:#4A443A;
  --ink:#E8E0D2; --ink2:#B3A895; --ink3:#8C826F;
  --acc:#8FAF8C; --acc-ink:#1E1C18; --acc-soft:#2F3A2E; --fill:#34302A;
  --green:#7FB08A; --dotg:#7FB08A; --orange:#D4A257; --red:#E0805F; --neutral:#4A443A;
  --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --sand:#1E1C18; --paper:#2A2722; --paper2:#25221E; --hair:#3A352E; --sep2:#322E28; --rule:#4A443A;
  --ink:#E8E0D2; --ink2:#B3A895; --ink3:#8C826F;
  --acc:#8FAF8C; --acc-ink:#1E1C18; --acc-soft:#2F3A2E; --fill:#34302A;
  --green:#7FB08A; --dotg:#7FB08A; --orange:#D4A257; --red:#E0805F; --neutral:#4A443A;
  --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--sand)}
body{color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;margin:0;font-weight:400}
b,strong{font-weight:500}
.app{max-width:560px;margin:0 auto;padding:0 var(--px) 112px}
.mut{color:var(--ink2)}
/* Top: status row, then (per screen) nav + serif title */
.rolebar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-size:12px;color:var(--ink2)}
.rolebar .seg{width:168px;flex:none}
.nav{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.nav .back{display:inline-flex;align-items:center;gap:4px;color:var(--acc);background:none;border:0;font:inherit;font-weight:500;padding:0 8px 0 0;min-height:44px;cursor:pointer}
.nav .back svg{width:18px;height:18px}
.nav .acts{display:flex;margin-right:-10px}
.nav .act{display:grid;place-items:center;color:var(--acc);background:none;border:0;font:inherit;font-weight:500;min-width:44px;height:44px;padding:0 10px;cursor:pointer}
.nav .act svg{width:20px;height:20px}
h1{font-family:var(--serif);font-size:26px;font-weight:500;line-height:32px;margin:0 0 4px}
.lede{color:var(--ink2);font-size:14px;margin:0 0 24px}
.rolebar+h1{margin-top:4px}
.ttl{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;margin:0 0 12px}
.ttl h1{margin:0}
.tlink{background:none;border:0;font:inherit;font-weight:500;color:var(--acc);min-height:44px;padding:0 0 0 12px;cursor:pointer;white-space:nowrap}
/* Flat lists: full-width rows on paper, hairline top/bottom on the group, thin separators between rows. No radius. */
.group{margin:0 0 28px}
.sheet .group{margin-bottom:20px}
h1+.group{margin-top:24px}
.ghead{font-size:12px;color:var(--ink3);margin:0 0 8px;padding-top:4px}
.gfoot{font-size:12px;color:var(--ink3);margin:8px 0 0}
.list{background:var(--paper);margin:0 calc(-1*var(--px));border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.list>*+*{border-top:1px solid var(--sep2)}
.list.fin{background:var(--paper2)}
.list.deps{background:none;border:0}.list.deps>*+*{border-top:0}.list.deps>.drow{background:var(--paper);margin-bottom:8px}.list.deps>.drow:last-child{margin-bottom:0}.list.deps.fin>.drow,.list.deps>.drow.dquiet{background:var(--paper2)}
.cell{display:flex;align-items:center;gap:12px;min-height:48px;padding:12px var(--px);position:relative;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left}
button.cell{cursor:pointer}
button.cell:active,.cell.tap:active,.drow:active{background:var(--fill)}
.cell .main{flex:1;min-width:0}
.dlist .cell{min-height:40px;padding-top:7px;padding-bottom:7px}.dlist .cell .t{line-height:1.25}.dlist .cell .s,.dlist .cell .sn{margin-top:1px;line-height:1.3}.dlist .cell .fhl{padding-top:0;padding-bottom:0;margin-top:0;margin-bottom:0;min-height:0}.dlist .cell.tot{border-top:1px solid var(--rule,#DCD2C0)}
.cell .t,.t{font-size:16px}
.cell .s{font-size:12px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.cell .v{font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right;white-space:nowrap}
.cell .v.neg,.neg{color:var(--red)}.cell .v.pos,.pos{color:var(--green)}
.cell .big{font-size:16px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cell .big small{display:block;font-size:12px;font-weight:400;color:var(--ink2)}
.big.sm{font-size:16px}
.ic{font-size:20px;width:28px;text-align:center;flex:none;line-height:1;display:inline-flex;justify-content:center}
.ic.acc{color:var(--acc)}.ic svg{width:20px;height:20px}
.chev{width:8px;height:13px;flex:none;color:var(--rule)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dotg)}
.dot.low{background:var(--red)}.dot.mid{background:var(--orange)}
.badge{font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.badge.red{background:var(--badge);color:#fff}
.badge.ok{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.badge.warn{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
/* Buttons: min 44px; ONE filled (accent) per screen, the rest soft or plain accent text */
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:44px;border-radius:10px;border:0;font:inherit;font-weight:500;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
.btn.plain{background:var(--acc-soft);color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.cell:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg button:focus-visible,.sw:focus-visible,.drow:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stack{display:grid;gap:8px;margin:0 0 28px}
.link{background:none;border:0;font:inherit;font-weight:500;color:var(--acc);min-height:44px;padding:0 0 0 12px;cursor:pointer}
.sbtn,.gbtn{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--acc-soft);color:var(--acc);font:inherit;font-weight:500;cursor:pointer;flex:none;white-space:nowrap}
/* Summary groups (flat) */
.today{background:var(--paper);margin:0 calc(-1*var(--px)) 28px;padding:12px var(--px);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.today .state{font-size:14px;color:var(--ink2)}
.today .head{font-family:var(--serif);font-size:16px;font-weight:500;margin:4px 0 12px}
.hero{text-align:center;padding:4px 0 16px}
.hero .n{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:32px}
.hero .u{color:var(--ink2);font-size:14px;margin-top:4px}
.kpis{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr);gap:8px}
.kpi .k{font-size:12px;color:var(--ink3)}
.kpi .n{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:28px;margin-top:4px}
.live{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--ink2);margin:0 0 12px}
button.live{width:100%;background:none;border:0;font:inherit;font-size:12px;color:var(--ink2);cursor:pointer;min-height:44px;margin:0 0 4px}
/* Search + segmented */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 12px;height:44px;margin:0 0 24px}
.search input{border:0;background:none;font:inherit;color:var(--ink);width:100%;outline:none}
.search svg{width:16px;height:16px;color:var(--ink2);flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;font:inherit;font-weight:500;color:var(--ink2);padding:0 8px;border-radius:8px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--hair)}
/* Forms inside lists */
.field{display:flex;align-items:center;gap:12px;min-height:48px;padding:4px var(--px);position:relative}
.field label,.field .lab{flex:1;font-size:16px;min-width:0}
.field label .s{font-size:12px;color:var(--ink2)}
.field input,.field select{border:0;background:none;font:inherit;color:var(--ink);text-align:right;width:52%;min-height:44px}
.field select{color:var(--acc)}
.field input::placeholder,.note::placeholder{color:var(--ink3)}
.field input:disabled{color:var(--ink2);opacity:1}
.note{display:block;width:calc(100% + 2*var(--px));margin:0 calc(-1*var(--px));min-height:96px;border:0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--paper);border-radius:0;font:inherit;color:var(--ink);padding:12px var(--px);resize:vertical}
/* Switch */
.sw{width:60px;height:44px;background:none;border:0;position:relative;cursor:pointer;flex:none;padding:0}
.sw i{position:absolute;right:0;top:8px;width:48px;height:28px;border-radius:99px;background:var(--fill);border:1px solid var(--rule);transition:background .2s}
.sw i::after{content:"";position:absolute;top:1px;left:1px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"] i{background:var(--acc);border-color:var(--acc)}
.sw[aria-checked="true"] i::after{transform:translateX(20px)}
.sw:disabled{opacity:.45;cursor:default}
/* Cart / editor lines */
.li{padding:12px var(--px);display:grid;gap:8px;position:relative}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lhead .t{display:flex;align-items:center;gap:8px;font-weight:500}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:0;background:var(--fill);color:var(--acc);font:inherit;font-size:22px;line-height:1;cursor:pointer;flex:none}
.stepper input{width:84px;height:44px;text-align:center;font:inherit;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;border:0;background:var(--fill);border-radius:10px;color:var(--ink)}
.stepper .ulab{color:var(--ink2)}
.mini{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.mini input{width:104px;height:44px;text-align:right;border:0;background:var(--fill);border-radius:10px;font:inherit;font-variant-numeric:tabular-nums;color:var(--ink);padding:0 12px}
/* Warnings: flat band */
.warn{background:color-mix(in srgb,var(--orange) 12%,var(--paper));margin:0 calc(-1*var(--px)) 28px;border-top:1px solid color-mix(in srgb,var(--orange) 40%,var(--hair));border-bottom:1px solid color-mix(in srgb,var(--orange) 40%,var(--hair));padding:12px var(--px)}
.warn ul{margin:4px 0 0;padding-left:16px}.warn li{margin:4px 0}
.warn .link{padding:0;margin-top:0}
.cell.w-orange{box-shadow:inset 3px 0 0 var(--orange)}.cell.w-orange .s{color:var(--orange)}
.cell.w-red{box-shadow:inset 3px 0 0 var(--red)}.cell.w-red .s{color:var(--red)}
.wi{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.okc{color:var(--green)}.wc{color:var(--orange)}
/* Tab bar: flat */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper2);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;font:inherit;font-size:12px;font-weight:500;color:var(--ink3);padding:8px 0 4px;display:grid;justify-items:center;gap:4px;cursor:pointer;min-height:52px;position:relative}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--acc)}
.tab .bdg{position:absolute;top:4px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--badge);color:#fff;font-size:11px;font-weight:500;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
.chipsel[hidden],.chips[hidden],.group[hidden]{display:none}
/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#pickRoot .scrim{z-index:25}
.sheet{background:var(--sand);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:0 var(--px) calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .bar{position:sticky;top:0;background:var(--sand);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;margin-bottom:8px;z-index:2}
.sheet .bar b{font-family:var(--serif);font-size:16px;font-weight:500}
.sheet .bar button{background:none;border:0;font:inherit;color:var(--acc);cursor:pointer;min-height:44px;padding:0;text-align:left}
.sheet .bar .ok{font-weight:500;text-align:right}
.sheet .bar button:disabled{color:var(--ink3)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sw i,.sw i::after{animation:none;transition:none}}
/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sand);border-radius:10px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);width:max-content;z-index:30}
.toast button{background:none;border:0;font:inherit;font-weight:500;color:var(--acc-soft);min-height:44px;padding:0 12px;cursor:pointer}
.toast.err{background:var(--red);color:#fff}
.toast.err button{color:#fff}
.empty{color:var(--ink2);padding:16px;text-align:center}
.divider{display:none}
.msec{display:flex;justify-content:space-between;align-items:center;margin:0 0 4px}
.msec h2{font-size:12px;font-weight:400;color:var(--ink3);margin:0}
.msec .link{padding:0}
.cell.mv{min-height:48px;padding-block:8px}
.mv .t{font-size:14px}.mv .s{font-size:12px}.mv .v{font-size:14px;font-weight:500}
/* Product chips, ticket thumbnail */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--fill);color:var(--ink);font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);font-weight:500}
.lhead .tn{display:flex;align-items:center;gap:8px;width:auto;height:44px;margin:0;padding:0;font-size:16px;font-weight:500;color:var(--ink);text-align:left}
.tk{display:flex;align-items:center;gap:12px;padding:8px var(--px)}
.tk .thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--fill);flex:none}
.tk .nm{flex:1;min-width:0;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk button{background:none;border:0;font:inherit;color:var(--red);min-height:44px;padding:0 0 0 8px;cursor:pointer}
.icons{display:flex;flex-wrap:wrap;gap:8px;padding:12px var(--px)}
.icons button{width:44px;height:44px;border-radius:10px;border:2px solid transparent;background:var(--fill);font-size:20px;line-height:1;cursor:pointer;padding:0}
.icons button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.icons button:disabled{cursor:default}
/* Date nav, filter */
.dnav{display:flex;align-items:center;min-height:44px;margin:0 -8px 0 -12px}
.dnav button{background:none;border:0;font:inherit;color:var(--acc);cursor:pointer;min-height:44px}
.dnav .nx{width:44px;display:grid;place-items:center;flex:none}.dnav .nx svg{width:18px;height:18px}
.dnav .dt{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;padding:0 4px}
.dnav .dt svg{color:var(--acc);width:18px;height:18px}
.dnav .sp{flex:1}
.dnav .hoy{font-weight:500;color:var(--acc);padding:0 12px}
.fbtn{position:relative;width:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--acc)}
.fbtn svg{width:20px;height:20px}
.fbtn .fdot{position:absolute;top:10px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--sand)}
.daterow{display:flex;align-items:center;justify-content:space-between;margin:0 -8px}
.daterow button{background:none;border:0;font:inherit;color:var(--acc);cursor:pointer;min-height:44px}
.daterow .nx{width:44px;font-size:22px;line-height:1;flex:none}
.daterow .wk{flex:1;font-weight:500;color:var(--ink);text-align:center}
.fchips{margin:0 0 8px}
.fline{color:var(--ink2);text-align:center;margin:0 0 8px}
.fline .link{padding:0 4px;min-height:32px}
/* Money: bruto green on top, neto under it (11px) */

.drow.dcompact{padding-block:8px}
.drow.dquiet{padding-block:6px;background:var(--paper2)}.drow.dquiet .cn,.drow.dquiet .mq,.drow.dquiet .ki{color:var(--ink3);font-size:13px}.drow.dquiet .mq{flex:none;display:inline-flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}.drow.dquiet .aw{color:var(--orange);display:inline-flex;align-items:center;gap:2px}.drow.dquiet .l1{min-height:20px}.drow.dquiet .px{flex:none;color:var(--ink3);font-size:13px;white-space:nowrap}

.drow.dcompact .l2 .lf{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

const PERMS=[['compras','Agregar compras'],['revisar','Marcar revisado'],['pagar','Pagar eventuales'],['inventario','Inventario completo'],['ajuste','Ajustar inventario'],['editar','Editar o anular compras'],['config','Configuración (productos, tarifas y permisos)']];

const S={role:'op',realRole:'op',user:'',date:'',wk:'',
  perms:{admin:{},op:{}},items:[],purchases:[],moves:[],priceLog:{},deps:[],paid:{},rates:[],weekly:[],externos:[],control:[],tours:[],comidas:[],fh:{},pend:[],salud:[],rebuildPending:false,fhOk:true,offline:false,dataAt:0,

const API=(fn,...args)=>fetch(EXEC,{method:'POST',body:JSON.stringify({type:'api',fn,args})})
  .then(r=>{if(!r.ok)throw new Error('Servidor '+r.status);return r.json()})
  .then(j=>{if(!j||!j.ok)throw new Error((j&&j.error)||'Error del servidor');return j.result});
const errMsg=e=>{const m=String((e&&e.message)||e||'Error').replace(/^(Error:\s*)+/,'');
  return /Failed to fetch|NetworkError|Load failed/i.test(m)?'Sin conexión. Intenta de nuevo.':m||'Error'};
const srv=(fn,...args)=>API(fn,PIN,...args).catch(e=>{if(/^PIN incorrecto|Demasiados intentos/.test(errMsg(e))&&PIN)logout(errMsg(e));throw e});
let busyN=0,bgN=0,pendingRender=false;
// setBusy(n): barra de carga solo para trabajo que bloquea (guardar). setBusy(n,true): segundo plano → solo gira el ícono de actualizar.
function setBusy(n,bg){if(bg)bgN=Math.max(0,bgN+n);else busyN=Math.max(0,busyN+n);$('busy').hidden=!busyN;paintStatus()}

function softRender(){
  const a=document.activeElement;
  if($('sheetRoot').innerHTML||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('app').contains(a))){pendingRender=true;return}
  const y=window.scrollY;pendingRender=false;render();window.scrollTo(0,y);
}
// Reloj de la app: avanza la hora del servidor cada minuto para que Terminadas / En curso / Próximas se actualicen solas
function tickClock(){
  if(!S.clk||!PIN||document.hidden)return;

}

  S.pend=d.pend||[];S.salud=d.salud||[];S.config=Object.assign({semana_inicio:'jueves',semana_pago:'jueves'},d.config||{});S.rebuildPending=!!d.rebuildPending;
  S.perms=d.perms;S.realRole=d.user.rol;S.user=d.user.nombre;
  if(S.realRole!=='admin'||!S.date)S.role=S.realRole;

// Caché local de la última respuesta (por usuario y rango): se pinta al instante y luego se pide lo nuevo
function cacheSave(from,to,d){
  try{
    const key=cacheKey(PIN,from,to),txt=JSON.stringify({at:Date.now(),d});
    if(txt.length>CACHE_MAX){localStorage.removeItem(key);return}
    localStorage.setItem(key,txt);
    const ik='adv_ops_cidx:'+strHash(PIN);let idx=[];try{idx=JSON.parse(localStorage.getItem(ik)||'[]')}catch(e){}
    idx=[key].concat(idx.filter(k=>k!==key));
    idx.slice(3).forEach(k=>localStorage.removeItem(k));          // solo los 3 rangos más recientes
    localStorage.setItem(ik,JSON.stringify(idx.slice(0,3)));
  }catch(e){}
}
function cacheRead(pin,from,to){
  try{const c=JSON.parse(localStorage.getItem(cacheKey(pin,from,to))||'null');
    if(!c||!c.d||!c.d.user||Date.now()-c.at>3*86400000)return null;return c}catch(e){return null}
}
function cacheClear(){try{Object.keys(localStorage).filter(k=>k.indexOf('adv_ops_c')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}
async function load(from,to){

  cacheSave(from||'',to||'',d);applyData(d);S.offline=false;   // la caché se guarda ANTES de mezclar los cambios por guardar
  if(d.stale)bgFin();
}
// getData ya no recalcula finanzas: si quedó atrás (stale), se pide aquí en segundo plano y se recarga sin molestar

  finBusy=true;finLast=Date.now();paintStatus();

}

}
// Escribir: llamar al servidor, volver a pedir los datos y pintar. Devuelve el resultado o null si falló.
let saving=false;
async function act(fn,args){
  if(saving)return null;
  saving=true;setBusy(1);toast('Guardando…','',900000);
  const btn=$('sheetOk');if(btn)btn.disabled=true;
  let r;
  try{r=await srv(fn,...args)}
  catch(e){toast(errMsg(e),'err');if(btn)btn.disabled=false;saving=false;setBusy(-1);return null}
  try{await load(S.win.from,S.win.to);render()}catch(e){toast('Guardado, pero no pude actualizar. Toca el botón de actualizar.','err')}

}

// ===== Guardar en segundo plano =====
// Compras, ajustes, conteos, revisiones, pagos y configuración: la hoja se cierra al instante, el cambio se ve de inmediato ("guardando…")
// y se manda en segundo plano. La cola vive en localStorage (sobrevive a recargar), se manda en orden con reintentos, y cada escritura lleva un id
// (uuid) que el servidor guarda en la columna "ID cliente": un reintento nunca duplica.
let Q=[],QK='',qBusy=false,qTimer=0,qDirty=false;
function qLoad(){QK='adv_ops_q:'+strHash(String(PIN));try{Q=JSON.parse(localStorage.getItem(QK)||'[]')||[]}catch(e){Q=[]}}
function qSave(){
  const txt=()=>JSON.stringify(Q);
  try{localStorage.setItem(QK,txt())}catch(e){try{cacheClear();localStorage.setItem(QK,txt())}catch(e2){toast('Sin espacio para guardar la cola. No cierres la app hasta que termine.','err')}}
}
function qCtx(){return {today:TODAY,hm:NOW,user:S.user}}
function qOverlay(){Q.forEach(q=>{try{optApply(S,q,qCtx())}catch(e){console.warn(e)}})}
function indexMoves(){(S.moves||[]).forEach((m,n)=>{m._n=n})}
function enqueue(fn,args){
  const p=args[0],cid=(p&&typeof p==='object'&&p.cid)||uuid();
  if(!(p&&typeof p==='object'&&p.cid))args=args.concat([cid]);
  const q={id:cid,fn,args,at:Date.now(),tries:0,fail:'',err:''};
  Q.push(q);qSave();
  optApply(S,q,qCtx());indexMoves();
  paintStatus();render();
  pump();
  return q;
}
function qFailToast(q){
  toast('No se guardó: '+q.err,'err',12000,{label:'Reintentar',fn:()=>qRetry(q.id)});
}
function qRetry(id){const q=Q.find(x=>x.id===id);if(q){q.fail='';q.err='';q.tries=0;optMark(S,q);softRender()}clearTimeout(qTimer);paintStatus();pump()}
async function pump(){
  if(qBusy||!PIN||!Q.length)return;
  if(Q[0].fail)return;                            // el primero falló del todo: la cola espera (orden) hasta "Reintentar"
  qBusy=true;paintStatus();
  try{
    while(Q.length&&!Q[0].fail){
      const q=Q[0];
      try{await srv(q.fn,...q.args);Q.shift();qSave();qDirty=true;paintStatus()}
      catch(e){
        const m=errMsg(e),k=qClass(m);
        if(k==='auth'){break}
        q.tries++;
        if(k==='retry'&&q.tries<Q_MAX){qSave();clearTimeout(qTimer);qTimer=setTimeout(pump,qBackoff(q.tries));break}
        q.fail=k==='retry'?'red':'final';q.err=m;qSave();optMark(S,q);qFailToast(q);softRender();break}
    }
  }finally{qBusy=false;paintStatus()}
  if(!Q.length&&qDirty){qDirty=false;try{await load(S.win.from,S.win.to)}catch(e){}softRender();paintStatus()}   // al vaciarse: datos frescos del servidor
}
// Al volver la conexión o la app, los que fallaron por red se vuelven a intentar
function qKick(){if(!Q.length)return;const q=Q[0];if(q.fail==='red'){q.fail='';q.tries=0;optMark(S,q);softRender()}clearTimeout(qTimer);pump()}
window.addEventListener('online',qKick);
function openQueue(){
  if(!Q.length){closeSheet();return}
  sheet('Por guardar',`<div class="group"><div class="list">${Q.map(q=>`<div class="cell"><span class="main"><span class="t">${esc(Q_LABEL[q.fn]||q.fn)}</span><div class="s ${q.fail?'qerr':''}">${q.fail?'No se guardó: '+esc(q.err):'Guardando…'}</div></span>${q.fail?`<button class="link" data-qretry="${esc(q.id)}">Reintentar</button><button class="link" data-qdrop="${esc(q.id)}">Descartar</button>`:''}</div>`).join('')}</div>
    <div class="gfoot">Se guardan en orden. Si una falla, las siguientes esperan.</div></div>`,{closeLabel:'Cerrar'});
}

// ===== Operación helpers =====
// ==PURE-BEGIN== (sin DOM: tests/round2-ui.test.js ejecuta este bloque en node)
const NB='  ';
// Dinero: el signo menos (U+2212) va ANTES del $: «−$1,690», nunca «$-1,690». fmt conserva centavos donde existan; fmt0 redondea a pesos enteros (stock y reporte).
const moneyS=(n,dec)=>{n=Number(n);if(!isFinite(n))return '$0';const k=dec?100:1,r=Math.round(Math.abs(n)*k)/k;return (n<0&&r>0?'\u2212':'')+'$'+r.toLocaleString('es-MX',{maximumFractionDigits:dec?2:0})};
const fmt=n=>moneyS(n,true);
const fmt0=n=>moneyS(n,false);
const num=n=>Number(n).toLocaleString('es-MX',{maximumFractionDigits:1});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],WD3=['dom.','lun.','mar.','mié.','jue.','vie.','sáb.'],MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const p2=n=>String(n).padStart(2,'0');
const pd=d=>new Date(d+'T12:00:00');
const addD=(d,n)=>{const x=pd(d);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate())};

// "hace x min / h / días" o la fecha si pasaron más de 7 días
function relAgo(at,now){
  const sec=Math.max(0,Math.round((now-at)/1000));
  if(sec<60)return 'ahora';
  const m=Math.floor(sec/60);if(m<60)return 'hace '+m+' min';
  const h=Math.floor(m/60);if(h<24)return 'hace '+h+' h';
  const dd=Math.floor(h/24);if(dd<=7)return 'hace '+dd+(dd===1?' día':' días');
  const x=new Date(at);return fdate(x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate()));
}
// Reloj del servidor avanzado por el tiempo transcurrido (para datos guardados en el teléfono)
function advanceClock(today,now,ms){
  const hm=String(now||'00:00').split(':').map(Number);let tot=(hm[0]||0)*60+(hm[1]||0)+Math.floor(Math.max(0,ms)/60000);
  const days=Math.floor(tot/1440);tot%=1440;
  return {today:days?addD(today,days):today,now:p2(Math.floor(tot/60))+':'+p2(tot%60)};
}
// Bitácora Ida / Regreso: done (hecha) · late (no hecha y ya empezó la salida / ya terminó) · wait (todavía no toca). na = no aplica.
function bitParts(d,nowKey){
  const b=d.bit||'',na=b==='No aplica'||(b==='Sin bitácora'&&!(d.bookings||[]).length);

  return {na,ida:idaOk?'done':nowKey>=start?'late':'wait',reg:regOk?'done':nowKey>end?'late':'wait'};
}

function packs(it,s){

function optApply(S,q,ctx){

let cart=null;
const units=l=>l.i?(l.mode==='caja'?l.qty*l.pack:l.qty):0;
function emptyLine(){return {i:null,mode:'unidad',pack:1,qty:0,price:0}}
function newLine(id){const it=item(id),p=prefs[id]||{};const mode=it.pack>1?(p.mode||'caja'):'unidad';return {i:id,mode,pack:p.pack||it.pack,qty:0,price:it.price}}
// Un producto = un renglón de "recibo": selector (agrupado por grupo) · cantidad · precio · y abajo "Cerveza × 24 ····· $370"
function prodSelect(l,k){
  const its=S.items.filter(i=>i.active),gs=[...new Set(its.map(i=>i.group))];
  return `<select class="cSel" data-k="${k}" aria-label="Producto"><option value=""${l.i?'':' selected'} disabled>Elegir producto…</option>${gs.map(g=>`<optgroup label="${esc(g||'Otros')}">${its.filter(i=>i.group===g).map(i=>`<option value="${esc(i.id)}"${l.i===i.id?' selected':''}>${i.icon} ${esc(i.name)}</option>`).join('')}</optgroup>`).join('')}</select>`;
}
function lineHtml(l,k){
  const it=l.i?item(l.i):null,multi=cart.lines.length>1;
  const rm=multi?`<button type="button" class="rrm" data-rm="${k}" aria-label="Quitar producto">${svgI('x',18)}</button>`:'';
  if(!it)return `<div class="rl" data-k="${k}"><div class="rsel">${prodSelect(l,k)}${rm}</div></div>`;
  const pn=cap(it.packName||'caja');
  return `<div class="rl" data-k="${k}">
    <div class="rsel">${prodSelect(l,k)}${rm}</div>
    ${it.pack>1?`<div class="seg" role="group" aria-label="Modo de cantidad"><button type="button" data-mode="${k}:caja" aria-pressed="${l.mode==='caja'}">${esc(pn)}</button><button type="button" data-mode="${k}:unidad" aria-pressed="${l.mode==='unidad'}">Unidad</button></div>`:''}
    <div class="stepper"><button type="button" data-step="${k}:-1" aria-label="Menos">−</button><input class="cQ" data-k="${k}" type="number" inputmode="decimal" min="0" step="any" value="${l.qty||''}" placeholder="0" aria-label="Cantidad"><button type="button" data-step="${k}:1" aria-label="Más">+</button><span class="ulab">${l.mode==='caja'?esc(plural(it.packName||'caja')):esc(it.units)}</span></div>
    ${l.mode==='caja'&&it.pack>1?`<label class="mini"><span>Unidades por ${esc(it.packName||'caja')}</span><input class="cK" data-k="${k}" type="number" inputmode="numeric" min="1" value="${l.pack}"></label>`:''}
    <label class="mini"><span>Precio por ${esc(it.unit)}</span><input class="cP" data-k="${k}" type="number" inputmode="decimal" step="any" value="${l.price}"></label>
    <div class="rrow"><span class="rt"></span><i class="rdots" aria-hidden="true"></i><span class="rm"></span></div>

}
function renderCart(){
  $('cart').innerHTML=cart.lines.map(lineHtml).join('');

}
function updateTotals(){
  let tot=0;
  cart.lines.forEach((l,k)=>{if(!l.i)return;const u=units(l),el=document.querySelector(`.rl[data-k="${k}"]`);if(el){const it=item(l.i);el.querySelector('.rt').textContent=`${it.name} × ${num(u)}`;el.querySelector('.rm').textContent=fmt(u*l.price)}tot+=u*l.price});
  $('sTot').textContent=fmt(tot);const hf=$('hastaF');if(hf)hf.hidden=!cart.lines.some(l=>l.i==='fru');
  const ok=$('sheetOk');if(ok)ok.disabled=!cart.lines.some(l=>units(l)>0);
}
function renderTicket(){
  $('tkName').textContent=cart.ticket?'Cambiar ticket':'Ticket (opcional)';
  $('tkBox').innerHTML=cart.ticket?`<div class="tk">${cart.ticketUrl?`<img class="thumb" src="${cart.ticketUrl}" alt="Foto del ticket">`:'<span class="thumb"></span>'}<span class="nm">${esc(cart.ticket)}</span><button type="button" data-tkrm>Quitar</button></div>`:'';
}
function setTicket(f){
  if(cart.ticketUrl){try{URL.revokeObjectURL(cart.ticketUrl)}catch(e){}}
  cart.file=f||null;cart.ticket=f?f.name:'';cart.ticketUrl='';

let supMap={};
function supLoad(){try{supMap=JSON.parse(localStorage.getItem('adv_ops_sup')||'{}')||{}}catch(e){supMap={}}}
function supSave(){try{localStorage.setItem('adv_ops_sup',JSON.stringify(supMap))}catch(e){}}
// Proveedor: se rellena con el último usado para ese producto, mientras la persona no lo haya escrito
function applySup(){
  if(cart.supTouched)return;const el=$('sSup');if(!el)return;

function openCompra(pre){

  sheet('Gasto / Compra',`<div class="tkrow"><label>${svgI('camera',20)}<span id="tkName">Ticket (opcional)</span><input id="tkFile" type="file" accept="image/*" hidden></label></div><div id="tkBox"></div>

function cartInput(e){
  const t=e.target;
  if(t.id==='tkFile'){const f=t.files&&t.files[0]||null;if(f!==cart.file)setTicket(f);return}
  if(t.id==='sSup'){cart.supTouched=true;return}
  const l=cart.lines[+t.dataset.k];if(!l)return;
  if(t.classList.contains('cSel')){if(l.i!==t.value){cart.lines[+t.dataset.k]=newLine(t.value);renderCart();applySup();const q=document.querySelector(`.cQ[data-k="${t.dataset.k}"]`);if(q)q.focus()}return}
  if(t.classList.contains('cQ'))l.qty=Math.max(0,+t.value||0);
  else if(t.classList.contains('cK')){l.pack=Math.max(1,+t.value||1);setPref(l)}
  else if(t.classList.contains('cP'))l.price=Math.max(0,+t.value||0);
  else return;
  updateTotals();
}
// Foto del ticket: se reduce en el teléfono (máx. 1000 px, JPEG) y el servidor la guarda en Drive
function shrink(file){return new Promise(res=>{try{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{try{const k=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.7))}catch(e){res('')}};
  img.onerror=()=>{URL.revokeObjectURL(url);res('')};img.src=url}catch(e){res('')}})}
async function saveCompra(){
  const ls=cart.lines.filter(l=>units(l)>0);if(!ls.length)return;
  const sup=$('sSup').value.trim()||'Sin proveedor',d=$('sDate').value||TODAY,note=$('sNote').value.trim(),hasta=$('sHasta')?$('sHasta').value:'';
  const payload={cid:uuid(),d,sup,note,hasta:ls.some(l=>l.i==='fru')?hasta:'',ticket:cart.ticket,lines:ls.map(l=>({i:l.i,q:units(l),p:l.price}))},file=cart.file;
  ls.forEach(setPref);supMap=supRemember(supMap,ls.map(l=>l.i),sup);supSave();
  closeSheet();                                           // la hoja se cierra al instante; lo demás pasa en segundo plano
  if(file)payload.ticketData=await shrink(file);          // foto del ticket: se reduce primero (≈ 0.2 s) y viaja con la compra
  enqueue('addCompra',[payload]);toast('Compra registrada');
}

const BIT_T={done:['ok','Hecha'],late:['late','Falta'],wait:['','Por hacer']};

function bitSection(d,fut){

    const rows=ids.map(it=>{const i=it.id,o=out[i]||0,bev=it.group==='Bebidas',bk=bev?(d.back?(back[i]||0):null):0;
      const used=!d.out?null:bev?(d.back?Math.max(0,o-bk):null):o;

const BOAT_I='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M12 4.5l6 9.5h-6"/><path d="M12 8L7 14h5"/><path d="M4 17.5h16l-2.2 3.2H6.2z"/></svg>';
// Fila de salida (lista plana): 4 líneas en posiciones fijas, nada salta.
//  1  hora · estado ............ bruto     2  nombre del tour (serif) ............ neto     3  recursos · tripulación     4  bitácora ● Ida ● Regreso ............ check-in · ⚠N · revisión
function depCard(d,sec){
  const st=status(d),n=netOf(d),fut=st==='prog',est=d.netSource==='estimado',bp=bitParts(d,nowKey());
  const first=x=>String(x||'').trim().split(/\s+/)[0];
  const crew=d.crew.map(x=>`${x.ext?'Ext.':x.r?esc(rb(x.r)):'<span class="wq">?</span>'} ${esc(first(x.n))}`).join(' · ');
  const res=(d.res||[]).map(r=>esc(r.name)).join(' · ');
  const rent=isRenta(d),nores=noRes(d);
  const word=sec==='done'?'terminado':sec==='live'?'en curso':'próxima';
  const dot=(l,k)=>`<span class="bd"><i class="bdot ${BIT_T[k][0]}"></i>${l}<span class="sr">${BIT_T[k][1]}</span></span>`;
  const bits=bp.na?'<span class="bd">No aplica</span>':`<span class="bds">${dot('Ida',bp.ida)}${dot('Regreso',bp.reg)}</span>`;
  const an=depAlertN(d,nowKey());
  let rt=ciChip(d.ci,ciState(d.ci,depStarted(d,nowKey())));
  if(an)rt+=`<span class="wn" aria-label="${an} ${an===1?'aviso':'avisos'}">${svgI('alert',16)}${an}</span>`;
  // Revisión: solo un ícono. Pendiente = el día ya terminó y nadie la marcó; verde = revisada. Hoy y días futuros: nada.
  if(d.rev)rt+=`<span class="ri ok" role="img" aria-label="Revisado">${svgI('check',18)}</span>`;
  else if(needsReview(d,TODAY))rt+=`<span class="ri" role="img" aria-label="Por revisar">${svgI('clock',18)}</span>`;
  const l3=[res||(nores?`<span class="nores">${WI}Sin recurso</span>`:''),crew||(rent?'':'Sin tripulación')].filter(Boolean).join(' · ');
  const netT=fut?'':n===null?'<span class="nt pend">neto pendiente</span>':`<span class="nt">neto ${fmt(n)}${est?' est.':''}</span>`;
  if(rent||d.barco==='otro'){
    // Rentas y pases: una sola línea gris (hora · nombre · pax ..... bruto). Solo el ⚠ conserva color.
    const pax=(d.bookings||[]).reduce((a,b)=>a+(Number(b.pax)||0),0);
    const an=depAlertN(d,nowKey());
    return `<button class="drow dcompact dquiet dcard s-${sec||'x'}" data-dep="${d.id}">
    <span class="l1"><span class="ln"><span class="ki">${svgI('kayak',16)}</span><span class="cn">${d.time} ${esc(d.item)}${d.label?` · ${esc(d.label)}`:''}</span>${pax?`<span class="px">· ${personasTxt(pax)}</span>`:''}</span><span class="mq">${an?`<span class="aw">${WI}${an}</span>`:''}${d.gross===null||d.gross===undefined||d.gross===''?'—':fmt(d.gross)}</span></span></button>`;
  }
  return `<button class="drow dcard s-${sec||'x'}" data-dep="${d.id}">
    <span class="l1"><span class="st-w"><span class="hr">${d.time}</span> · <span class="st${sec==='live'?' now':''}">${word}</span></span><span class="mg">${d.gross===null||d.gross===undefined||d.gross===''?'—':fmt(d.gross)}</span></span>
    <span class="l2"><span class="tn">${esc(d.item)}${d.label?` <span class="lbl">· ${esc(d.label)}</span>`:''}</span>${netT}</span>
    <span class="l3">${l3||'&nbsp;'}</span>
    <span class="l4">${bits}<span class="rt">${rt}</span></span></button>`;
}

  const rv=on('[data-roleview]');if(rv){stackView={name:'role',arg:rv.dataset.roleview};render();goTop();return}
  const pm=on('[data-perm]');if(pm){const[r,p]=pm.dataset.perm.split(':');
    if(can('config')&&!(r==='admin'&&p==='config')){const cur=!!S.perms[r][p];S.perms[r][p]=!cur;render();
      srv('savePerm',r,p,!cur).catch(er=>{S.perms[r][p]=cur;render();toast(errMsg(er),'err')})}return}
  const thb=on('[data-theme-set]');if(thb){const m=thb.dataset.themeSet;window.setTheme(m);render();return}
  const pwb=on('[data-payw]');if(pwb){askPayWeek(pwb.dataset.payw);return}
  const cfb=on('[data-cfg]');if(cfb){const i=cfb.dataset.cfg.indexOf(':');setCfg(cfb.dataset.cfg.slice(0,i),cfb.dataset.cfg.slice(i+1));return}
  if(on('[data-logout]')){logout();return}
  if(on('[data-refresh]')){refresh();return}
  if(on('[data-fopen]')){S.fopen=!S.fopen;render();return}
  const fl=on('[data-filter]');if(fl){S.filter=depFilter(fl.dataset.filter).key;S.fopen=false;try{localStorage.setItem('adv_ops_depfilter',S.filter)}catch(e){}render();return}
  if(on('[data-today]')){setDate(TODAY);return}
  const bx=on('[data-bitx]');if(bx){bitOpen=bitOpen===bx.dataset.bitx?null:bx.dataset.bitx;render();return}
  const dy=on('[data-day]');if(dy){setDate(addD(S.date,+dy.dataset.day));return}
  if(on('[data-cal]')){cal={y:pd(S.date).getFullYear(),m:pd(S.date).getMonth()};calMonth();return}
  const rv2=on('[data-rev]');if(rv2){doRev(rv2.dataset.rev);return}
  const bkr=on('[data-bk]');if(bkr){const a=bkr.dataset.bk.split('|');openBooking(a[0],a[1]);return}
  const dp=on('[data-dep]');if(dp){S.depFrom='';stackView={name:'dep',arg:dp.dataset.dep};render();goTop();return}
  const wk=on('[data-wk]');if(wk){setWk(addD(S.wk,7*(+wk.dataset.wk)));return}
  const pe2=on('[data-person]');if(pe2){stackView={name:'person',arg:pe2.dataset.person};render();goTop();return}
  const py=on('[data-pay]');if(py){doPaid(py.dataset.pay);return}
  const rt=on('[data-rate]');if(rt){openRate(rt.dataset.rate);return}
  const tr2=on('[data-tour]');if(tr2){openTour(tr2.dataset.tour);return}
  const pd2=on('[data-pend]');if(pd2){openPend(+pd2.dataset.pend);return}
  const a=on('[data-act]');if(!a)return;const act2=a.dataset.act,pre=a.dataset.pre;
  if(act2==='compra'&&can('compras'))openCompra(pre);
  if(act2==='sreport')openReport();
  if(act2==='addprod'&&can('config'))openProducto();
  if(act2==='menu'&&menuOk())openMenu(pre);
  if(act2==='pmenu'&&can('editar'))openPMenu(pre);
});
start();
})();
</script>
</body>
</html>
