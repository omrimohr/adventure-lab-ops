<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adventure Lab Ops</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AL Ops">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* reset that the claude.ai page skeleton used to provide */
[hidden]{display:none!important}
body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
</style>
<style>
/* Layout: iOS-style phone app — large title per screen, inset grouped lists, bottom tab bar, bottom sheets for forms.
   Type: the device's own system face (SF on iPhone) on purpose, so it feels native. One accent: Bacalar lagoon turquoise. */
:root{
  --ground:#f2f2f7; --row:#ffffff; --ink:#111418; --ink2:#6b7076; --sep:#d8d8de; --fill:#e9e9ee;
  --lagoon:#00939c; --lagoon-ink:#ffffff; --lagoon-soft:#d6eff0;
  --red:#d93a2f; --orange:#d27a00; --yellow:#c79500; --green:#2a9d4b;
  --bar:rgba(249,249,251,.92); --scrim:rgba(0,0,0,.32);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#000000; --row:#1c1c1e; --ink:#f2f2f5; --ink2:#9a9aa1; --sep:#38383c; --fill:#2c2c2e;
  --lagoon:#2cc4cc; --lagoon-ink:#00262a; --lagoon-soft:#0f3a3d;
  --red:#ff5a4f; --orange:#ff9f0a; --yellow:#ffd60a; --green:#32d164; --bar:rgba(22,22,24,.92); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#000000; --row:#1c1c1e; --ink:#f2f2f5; --ink2:#9a9aa1; --sep:#38383c; --fill:#2c2c2e;
  --lagoon:#2cc4cc; --lagoon-ink:#00262a; --lagoon-soft:#0f3a3d;
  --red:#ff5a4f; --orange:#ff9f0a; --yellow:#ffd60a; --green:#32d164; --bar:rgba(22,22,24,.92); --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.3;margin:0}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 110px}
/* Top */
.rolebar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:50px;font-size:13px;color:var(--ink2)}
.rolebar .seg{width:200px;flex:none}
.nav{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.nav .back{color:var(--lagoon);background:none;border:0;font:inherit;padding:10px 0;min-height:44px;cursor:pointer}
.nav .acts{display:flex;margin-right:-10px}
.nav .act{color:var(--lagoon);background:none;border:0;font:inherit;font-size:28px;line-height:1;width:44px;height:44px;cursor:pointer}
h1{font-family:var(--font-d);font-size:34px;font-weight:700;letter-spacing:.01em;margin:2px 0 4px}
.lede{color:var(--ink2);font-size:15px;margin:0 0 18px}
/* Grouped lists */
.group{margin:0 0 26px}
.ghead{font-size:13px;color:var(--ink2);margin:0 0 7px 16px}
.gfoot{font-size:13px;color:var(--ink2);margin:7px 16px 0}
.list{background:var(--row);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;position:relative;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
button.cell{cursor:pointer}
button.cell:active{background:var(--fill)}
.cell .main{flex:1;min-width:0}
.cell .t{font-size:17px}
.cell .s{font-size:14px;color:var(--ink2);margin-top:2px}
.cell .v{font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right;white-space:nowrap}
.cell .v.neg{color:var(--red)}.cell .v.pos{color:var(--green)}
.cell .big{font-size:22px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cell .big small{display:block;font-size:13px;font-weight:400;color:var(--ink2)}
.ic{font-size:22px;width:28px;text-align:center;flex:none;line-height:1}
.chev{width:8px;height:13px;flex:none;color:var(--sep)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--green)}
.dot.low{background:var(--red)}.dot.mid{background:var(--orange)}
.badge{font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--lagoon-soft);color:var(--lagoon);white-space:nowrap}
.badge.red{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
/* Today hero */
.today{background:var(--row);border-radius:16px;padding:18px 18px 16px;margin:0 0 26px}
.today .state{font-size:15px;color:var(--ink2)}
.today .head{font-family:var(--font-d);font-size:24px;font-weight:700;margin:4px 0 14px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:50px;border-radius:12px;border:0;font:inherit;font-weight:600;cursor:pointer;background:var(--lagoon);color:var(--lagoon-ink)}
.btn.plain{background:var(--fill);color:var(--lagoon)}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.cell:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg button:focus-visible,.sw:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.stack{display:grid;gap:10px}
/* Detail hero */
.hero{text-align:center;padding:6px 0 22px}
.hero .n{font-family:var(--font-d);font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.hero .u{color:var(--ink2);font-size:15px;margin-top:6px}
/* Search + segmented */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;margin:0 0 18px}
.search input{border:0;background:none;font:inherit;font-size:17px;color:var(--ink);width:100%;outline:none}
.search svg{width:16px;height:16px;color:var(--ink2);flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--ink);padding:7px 6px;border-radius:7px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--row);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* Forms inside lists */
.field{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 16px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.field label,.field .lab{flex:1;font-size:17px;min-width:0}
.field label .s{font-size:14px;color:var(--ink2)}
.field input,.field select{border:0;background:none;font:inherit;color:var(--ink);text-align:right;width:52%;min-height:44px}
.field select{color:var(--lagoon)}
.field input::placeholder,.note::placeholder{color:var(--ink2)}
.field .pick{color:var(--lagoon);text-align:right}
.note{display:block;width:100%;min-height:92px;border:0;background:var(--row);border-radius:12px;font:inherit;color:var(--ink);padding:12px 16px;resize:vertical}
/* Switch */
.sw{width:60px;height:44px;background:none;border:0;position:relative;cursor:pointer;flex:none;padding:0}
.sw i{position:absolute;right:0;top:7px;width:51px;height:30px;border-radius:99px;background:var(--fill);border:1px solid var(--sep);transition:background .2s}
.sw i::after{content:"";position:absolute;top:1px;left:1px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"] i{background:var(--green);border-color:var(--green)}
.sw[aria-checked="true"] i::after{transform:translateX(21px)}
.sw:disabled{opacity:.45;cursor:default}
/* Cart */
.li{padding:12px 16px;display:grid;gap:10px;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lhead .t{display:flex;align-items:center;gap:8px;font-weight:600}
.lhead button{background:none;border:0;color:var(--ink2);font-size:18px;width:44px;height:44px;margin-right:-12px;cursor:pointer}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;background:var(--fill);color:var(--lagoon);font-size:24px;line-height:1;cursor:pointer;flex:none}
.stepper input{width:84px;height:44px;text-align:center;font:inherit;font-size:20px;font-weight:600;border:0;background:var(--fill);border-radius:10px;color:var(--ink)}
.stepper .ulab{color:var(--ink2);font-size:15px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;min-height:44px}
.mini input{width:104px;height:44px;text-align:right;border:0;background:var(--fill);border-radius:8px;font:inherit;color:var(--ink);padding:0 10px}
.mini b{font-size:17px}
.sticky{position:sticky;bottom:0;background:var(--ground);padding:12px 4px 6px;margin-top:8px;display:flex;justify-content:space-between;font-weight:700;font-size:20px;border-top:1px solid var(--sep)}
/* Warnings */
.warn{background:color-mix(in srgb,var(--orange) 16%,transparent);border:1px solid color-mix(in srgb,var(--orange) 55%,transparent);border-radius:12px;padding:12px 16px;font-size:15px;margin-bottom:18px}
.cell.w-orange{box-shadow:inset 4px 0 0 var(--orange)}.cell.w-orange .s{color:var(--orange)}
.cell.w-red{box-shadow:inset 4px 0 0 var(--red)}.cell.w-red .s{color:var(--red)}
.cell .s{overflow-wrap:anywhere}
/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;font:inherit;font-size:11px;font-weight:500;color:var(--ink2);padding:7px 0 6px;display:grid;justify-items:center;gap:3px;cursor:pointer;min-height:50px}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--lagoon)}
.tab{position:relative}
.tab .bdg{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.warn ul{margin:6px 0 0;padding-left:18px}.warn li{margin:2px 0}
.warn .link{min-height:44px;padding:0;margin-top:2px}
.chipsel[hidden],.chips[hidden],.group[hidden]{display:none}
.chips{margin:0 0 6px}
/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#pickRoot .scrim{z-index:25}
.sheet{background:var(--ground);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .bar{position:sticky;top:0;background:var(--ground);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:54px;margin-bottom:6px;z-index:2}
.sheet .bar b{font-size:17px}
.sheet .bar button{background:none;border:0;font:inherit;color:var(--lagoon);cursor:pointer;min-height:44px;padding:0;text-align:left}
.sheet .bar .ok{font-weight:600;text-align:right}
.sheet .bar button:disabled{color:var(--ink2)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sw i,.sw i::after{animation:none;transition:none}}
/* Toast with undo */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);z-index:30;font-size:15px}
.toast button{background:none;border:0;font:inherit;font-weight:600;color:var(--lagoon);min-height:44px;padding:0 10px;cursor:pointer}
.empty{color:var(--ink2);font-size:15px;padding:18px 16px;text-align:center}
.neg{color:var(--red)}.pos{color:var(--green)}
/* Movimientos section: set apart from the stock list */
.divider{height:1px;background:var(--sep);margin:10px calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.msec{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
.msec h2{font-family:var(--font-d);font-size:22px;font-weight:700;margin:0}
.link{background:none;border:0;font:inherit;color:var(--lagoon);min-height:44px;padding:0 0 0 12px;cursor:pointer}
.cell.mv{min-height:52px;padding:8px 16px}
.mv .t{font-size:15px}.mv .s{font-size:13px}.mv .v{font-size:15px;font-weight:600}
/* Cart: product chips inside a line, ticket thumbnail */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;border:0;background:var(--fill);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lagoon-soft);color:var(--lagoon);font-weight:600}
.lhead .tn{display:flex;align-items:center;gap:8px;width:auto;height:44px;margin:0;padding:0;font-size:17px;font-weight:600;color:var(--ink);text-align:left}
.lhead .tn .caret{color:var(--ink2);font-size:12px}
.lhead .pl{color:var(--ink2);font-weight:600}
.tk{display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--sep)}
.tk .thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--fill);flex:none}
.tk .nm{flex:1;min-width:0;font-size:15px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk button{background:none;border:0;font:inherit;color:var(--red);min-height:44px;padding:0 0 0 8px;cursor:pointer}
#tkBox+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
/* Product editor */
.icons{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.icons button{width:44px;height:44px;border-radius:10px;border:2px solid transparent;background:var(--fill);font-size:22px;line-height:1;cursor:pointer;padding:0}
.icons button[aria-pressed="true"]{border-color:var(--lagoon);background:var(--lagoon-soft)}
.icons button:disabled{cursor:default}
.field input:disabled{color:var(--ink2);opacity:1}
/* ===== v7: Operación, Eventuales, calendario ===== */
.daterow{display:flex;align-items:center;justify-content:space-between;margin:0 -10px 0}
.daterow button{background:none;border:0;font:inherit;color:var(--lagoon);cursor:pointer;min-height:44px}
.daterow .nx{width:44px;font-size:30px;line-height:1;flex:none}
.daterow .dt{flex:1;font-size:17px;font-weight:600;color:var(--ink);text-align:center;white-space:nowrap}
.daterow .wk{flex:1;font-size:16px;font-weight:600;color:var(--ink);text-align:center}
.live{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;color:var(--ink2);margin:0 0 14px}
.live .dot{width:8px;height:8px}
.kpis{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr);gap:8px}
.kpi .k{font-size:13px;color:var(--ink2)}
.kpi .n{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .n.pend{font-size:17px;color:var(--orange)}
.kpi .sub{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.today .fn{font-size:13px;color:var(--ink2);margin:12px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--fill);color:var(--ink)}
.pill.g{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.o{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pill.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.dcard{background:var(--row);border-radius:12px;margin:0 0 12px;overflow:hidden}
.dmain{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;color:inherit;padding:12px 16px 10px;cursor:pointer}
.dmain:active{background:var(--fill)}
.dmain:focus-visible,.sbtn:focus-visible,.cal button:focus-visible,.daterow button:focus-visible{outline:3px solid var(--lagoon);outline-offset:-3px}
.d1{display:flex;align-items:flex-start;gap:10px}
.d1 .tm{font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--lagoon)}
.d1 .tn{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.d1 .chev{margin-top:5px}
.lbl{font-weight:400;color:var(--ink2)}
.crew{font-size:14px;color:var(--ink2);margin:6px 0 0;line-height:1.5}
.sn{font-size:13px;color:var(--ink2);margin-top:1px;opacity:.9}
.rb{display:inline-block;font-size:12px;font-weight:600;padding:0 6px;border-radius:6px;background:var(--lagoon-soft);color:var(--lagoon);margin-right:4px}
.rb.w{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.d3{font-size:14px;margin:6px 0 0}
.nums{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.nums .pendt{color:var(--orange)}
.dfoot{border-top:1px solid var(--sep);padding:4px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;font-size:14px}
.dfoot .ok{color:var(--green);font-weight:600}
.dfoot .mut{color:var(--ink2)}
.sbtn{min-height:44px;padding:0 14px;border-radius:10px;border:0;background:var(--lagoon-soft);color:var(--lagoon);font:inherit;font-size:15px;font-weight:600;cursor:pointer;flex:none}
.trow{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr));gap:4px;padding:10px 16px;position:relative;font-size:15px;font-variant-numeric:tabular-nums;align-items:center}
.trow>span:not(:first-child){text-align:right}
.trow.th{font-size:13px;color:var(--ink2);padding-block:8px}
.trow+.trow::before,.trow+.cell::before,.cell+.trow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.mut{color:var(--ink2)}
.badge.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.badge.warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:0 -8px 4px}
.calhead b{font-size:17px;text-transform:none}
.calhead button{background:none;border:0;color:var(--lagoon);font:inherit;font-size:28px;width:44px;height:44px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;background:var(--row);border-radius:12px;padding:8px}
.cal .wd{font-size:12px;color:var(--ink2);padding:4px 0}
.cal button{min-height:48px;border:0;background:none;border-radius:10px;font:inherit;color:var(--ink);cursor:pointer;display:grid;justify-items:center;align-content:center;gap:3px;padding:0;font-variant-numeric:tabular-nums}
.cal button[aria-pressed="true"]{background:var(--lagoon-soft);color:var(--lagoon);font-weight:700}
.cal button.tdy .n{font-weight:700;color:var(--lagoon)}

<script>
// App instalable: service worker solo para el cascarón (la API nunca se guarda). Al tomar el control una versión nueva, se recarga una sola vez.
try{if('serviceWorker' in navigator&&location.protocol!=='file:'){
  var hadSW=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadSW){hadSW=true;return}if(reloaded)return;reloaded=true;location.reload()});
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}}catch(e){}

<script>
window.addEventListener('error',function(e){try{var b=document.getElementById('boot');if(b){b.hidden=false;b.innerHTML='<div style="padding:20px;font:13px monospace;white-space:pre-wrap">Error: '+String(e.message)+'\nlínea '+e.lineno+':'+e.colno+'</div>'}}catch(x){}});
window.addEventListener('unhandledrejection',function(e){try{var b=document.getElementById('boot');if(b&&!b.hidden){b.innerHTML+='<div style="padding:20px;font:13px monospace">Promesa: '+String((e.reason&&e.reason.message)||e.reason)+'</div>'}}catch(x){}});

<script>
(()=>{
// ===== Estado. Todo viene de la hoja de Google (getData). Aquí no hay datos de ejemplo. =====
let TODAY='',NOW='';
const PERMS=[['compras','Agregar compras'],['revisar','Marcar revisado'],['pagar','Pagar eventuales'],['inventario','Inventario completo'],['ajuste','Ajustar inventario'],['editar','Editar o anular compras'],['config','Configuración (productos, tarifas y permisos)']];
const ROLES=[['admin','Admin'],['op','Operación']];
const REASONS=['Merma','Pérdida','Rotura','Error de conteo','Otro'];
const GI={'Bebidas':'🥤','Combustible':'⛽','Consumo directo':'🧊','Comida empleado':'🍽️'};
const TYPES=[['ponton','Pontón'],['catamaran','Catamarán'],['monocasco','Monocasco'],['hobie','Hobie'],['sup','Paddle (SUP)'],['kayak','Kayak'],['otro','Otro']];
const RB={'Capitán':'Cap.','Marinero':'Mar.','Instructor':'Inst.','Auxiliar':'Aux.','Guía':'Guía'};
const rb=r=>RB[r]||(r.length>5?r.slice(0,4)+'.':r);
const S={role:'op',realRole:'op',user:'',date:'',wk:'',
  perms:{admin:{},op:{}},items:[],purchases:[],moves:[],priceLog:{},deps:[],paid:{},rates:[],weekly:[],externos:[],control:[],tours:[],comidas:[],fh:{},pend:[],salud:[],rebuildPending:false,fhOk:true,offline:false,dataAt:0,
  win:{from:'',to:''},fetchedAt:'',q:'',filter:'todas',fopen:false};
let PIN='';

// ===== Servidor =====
// Servidor: Apps Script web app (misma URL que el webhook de FareHarbor). POST text/plain = sin preflight CORS.
const EXEC='https://script.google.com/macros/s/AKfycbzUi-BEXRiNNShtlVSSc8tTMb9JZloofTHCJPougpu6h_f1HzQDF63wbjNXxf0nJI6ncQ/exec';
const API=(fn,...args)=>fetch(EXEC,{method:'POST',body:JSON.stringify({type:'api',fn,args})})
  .then(r=>{if(!r.ok)throw new Error('Servidor '+r.status);return r.json()})
  .then(j=>{if(!j||!j.ok)throw new Error((j&&j.error)||'Error del servidor');return j.result});
const errMsg=e=>{const m=String((e&&e.message)||e||'Error').replace(/^(Error:\s*)+/,'');
  return /Failed to fetch|NetworkError|Load failed/i.test(m)?'Sin conexión. Intenta de nuevo.':m||'Error'};
const srv=(fn,...args)=>API(fn,PIN,...args).catch(e=>{if(/^PIN incorrecto|Demasiados intentos/.test(errMsg(e))&&PIN)logout(errMsg(e));throw e});
let busyN=0,bgN=0,pendingRender=false;
// setBusy(n): barra de carga solo para trabajo que bloquea (guardar). setBusy(n,true): segundo plano → solo gira el ícono de actualizar.
function setBusy(n,bg){if(bg)bgN=Math.max(0,bgN+n);else busyN=Math.max(0,busyN+n);$('busy').hidden=!busyN;paintStatus()}
// Pintar datos nuevos sin perder la pantalla, el scroll ni un formulario abierto (si hay uno abierto, se pospone hasta cerrarlo)
function softRender(){
  const a=document.activeElement;
  if($('sheetRoot').innerHTML||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('app').contains(a))){pendingRender=true;return}
  const y=window.scrollY;pendingRender=false;render();window.scrollTo(0,y);
}
// Reloj de la app: avanza la hora del servidor cada minuto para que Terminadas / En curso / Próximas se actualicen solas
function tickClock(){
  if(!S.clk||!PIN||document.hidden)return;
  const a=advanceClock(S.clk.today,S.clk.now,Date.now()-S.clk.at);
  if(a.today===TODAY&&a.now===NOW)return;
  TODAY=a.today;NOW=a.now;
  if(tab==='op'&&!stackView)softRender();
}
function flushRender(){if(pendingRender)softRender()}
let lastLoad=Date.now(),finBusy=false,finLast=0;
function applyData(d,at){lastLoad=Date.now();S.dataAt=at||Date.now();S.fhOk=d.fhOk!==false;
  ['items','purchases','moves','priceLog','deps','rates','paid','weekly','externos','control','tours','comidas','fh','pend','salud','rebuildPending'].forEach(k=>{S[k]=d[k]});
  S.pend=d.pend||[];S.salud=d.salud||[];S.rebuildPending=!!d.rebuildPending;
  S.perms=d.perms;S.realRole=d.user.rol;S.user=d.user.nombre;
  if(S.realRole!=='admin'||!S.date)S.role=S.realRole;
  TODAY=d.today;NOW=d.now;S.clk={today:d.today,now:d.now,at:Date.now()};S.fetchedAt=d.now;S.win={from:d.desde,to:d.hasta};
  if(!S.date)S.date=TODAY;if(!S.wk)S.wk=wkStart(TODAY);
}
// Caché local de la última respuesta (por usuario y rango): se pinta al instante y luego se pide lo nuevo
function cacheSave(from,to,d){
  try{
    const key=cacheKey(PIN,from,to),txt=JSON.stringify({at:Date.now(),d});
    if(txt.length>CACHE_MAX){localStorage.removeItem(key);return}
    localStorage.setItem(key,txt);
    const ik='adv_ops_cidx:'+strHash(PIN);let idx=[];try{idx=JSON.parse(localStorage.getItem(ik)||'[]')}catch(e){}
    idx=[key].concat(idx.filter(k=>k!==key));
    idx.slice(3).forEach(k=>localStorage.removeItem(k));          // solo los 3 rangos más recientes
    localStorage.setItem(ik,JSON.stringify(idx.slice(0,3)));
  }catch(e){}
}
function cacheRead(pin,from,to){
  try{const c=JSON.parse(localStorage.getItem(cacheKey(pin,from,to))||'null');
    if(!c||!c.d||!c.d.user||Date.now()-c.at>3*86400000)return null;return c}catch(e){return null}
}
function cacheClear(){try{Object.keys(localStorage).filter(k=>k.indexOf('adv_ops_c')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}
async function load(from,to){
  const d=await srv('getData',from||'',to||'');
  applyData(d);S.offline=false;cacheSave(from||'',to||'',d);
  if(d.stale)bgFin();
}
// getData ya no recalcula finanzas: si quedó atrás (stale), se pide aquí en segundo plano y se recarga sin molestar
async function bgFin(){
  if(finBusy||!PIN||Date.now()-finLast<60000)return;
  finBusy=true;finLast=Date.now();paintStatus();
  try{await srv('refreshFin');await load(S.win.from,S.win.to);softRender()}catch(e){}
  finally{finBusy=false;paintStatus()}
}
// Fuera de la ventana cargada (hoy-21 … hoy+7) se vuelve a pedir al servidor
async function ensureRange(from,to){
  if(S.win.from&&from>=S.win.from&&to<=S.win.to)return;
  setBusy(1,true);S.loadingRange=true;
  try{await load(addD(from,-14),addD(to,14))}catch(e){toast(errMsg(e),'err')}finally{S.loadingRange=false;setBusy(-1,true)}
}
async function refresh(quiet){
  setBusy(1,true);
  try{await load(S.win.from,S.win.to);softRender()}catch(e){S.offline=/Sin conexión/.test(errMsg(e));paintStatus();if(!quiet)toast(errMsg(e),'err')}finally{setBusy(-1,true)}
}
// Escribir: llamar al servidor, volver a pedir los datos y pintar. Devuelve el resultado o null si falló.
let saving=false;
async function act(fn,args){
  if(saving)return null;
  saving=true;setBusy(1);toast('Guardando…','',900000);
  const btn=$('sheetOk');if(btn)btn.disabled=true;
  let r;
  try{r=await srv(fn,...args)}
  catch(e){toast(errMsg(e),'err');if(btn)btn.disabled=false;saving=false;setBusy(-1);return null}
  try{await load(S.win.from,S.win.to);render()}catch(e){toast('Guardado, pero no pude actualizar. Toca el botón de actualizar.','err')}
  saving=false;setBusy(-1);
  return r||{ok:true};

function relAgo(at,now){

let cart=null;
const units=l=>l.i?(l.mode==='caja'?l.qty*l.pack:l.qty):0;
function emptyLine(){return {i:null,mode:'unidad',pack:1,qty:0,price:0}}
function newLine(id){const it=item(id),p=prefs[id]||{};const mode=it.pack>1?(p.mode||'caja'):'unidad';return {i:id,mode,pack:p.pack||it.pack,qty:0,price:it.price}}
function lineHtml(l,k){
  const it=l.i?item(l.i):null,multi=cart.lines.length>1;
  const chips=(!it||l.choosing)?`<div class="chips" role="group" aria-label="Elegir producto">${S.items.filter(i=>i.active).map(i=>`<button type="button" class="chip" data-chip="${k}:${i.id}" aria-pressed="${l.i===i.id}"><span>${i.icon}</span>${esc(i.name)}</button>`).join('')}</div>`:'';

  if(!it)return `<div class="li" data-k="${k}"><div class="lhead"><span class="pl">Producto</span>${rm}</div>${chips}</div>`;
  const pn=cap(it.packName||'caja');
  return `<div class="li" data-k="${k}">
    <div class="lhead"><button type="button" class="tn" data-chg="${k}" aria-expanded="${!!l.choosing}" aria-label="Cambiar producto: ${esc(it.name)}"><span class="ic">${it.icon}</span>${esc(it.name)}<span class="caret">▾</span></button>${rm}</div>
    ${chips}
    ${it.pack>1?`<div class="seg" role="group" aria-label="Modo de cantidad"><button type="button" data-mode="${k}:caja" aria-pressed="${l.mode==='caja'}">${esc(pn)}</button><button type="button" data-mode="${k}:unidad" aria-pressed="${l.mode==='unidad'}">Unidad</button></div>`:''}
    <div class="stepper"><button type="button" data-step="${k}:-1" aria-label="Menos">−</button><input class="cQ" data-k="${k}" type="number" inputmode="decimal" min="0" step="any" value="${l.qty||''}" placeholder="0" aria-label="Cantidad"><button type="button" data-step="${k}:1" aria-label="Más">+</button><span class="ulab">${l.mode==='caja'?esc(plural(it.packName||'caja')):esc(it.units)}</span></div>
    ${l.mode==='caja'&&it.pack>1?`<label class="mini"><span>Unidades por ${esc(it.packName||'caja')}</span><input class="cK" data-k="${k}" type="number" inputmode="numeric" min="1" value="${l.pack}"></label>`:''}
    <label class="mini"><span>Precio por ${esc(it.unit)}</span><input class="cP" data-k="${k}" type="number" inputmode="decimal" step="any" value="${l.price}"></label>
    <div class="mini"><span class="lu" style="color:var(--ink2)"></span><b class="lt"></b></div>
  </div>`;
}
function renderCart(){
  $('cart').innerHTML=cart.lines.map(lineHtml).join('');
  updateTotals();
}
function updateTotals(){
  let tot=0;
  cart.lines.forEach((l,k)=>{if(!l.i)return;const u=units(l),el=document.querySelector(`.li[data-k="${k}"]`);if(el){el.querySelector('.lu').textContent=`${num(u)} ${item(l.i).units}`;el.querySelector('.lt').textContent=fmt(u*l.price)}tot+=u*l.price});
  $('sTot').textContent=fmt(tot);const hf=$('hastaF');if(hf)hf.hidden=!cart.lines.some(l=>l.i==='fru');
  const ok=$('sheetOk');if(ok)ok.disabled=!cart.lines.some(l=>units(l)>0);

function renderTicket(){

  $('tkBox').innerHTML=cart.ticket?`<div class="tk">${cart.ticketUrl?`<img class="thumb" src="${cart.ticketUrl}" alt="Foto del ticket">`:'<span class="thumb"></span>'}<span class="nm">${esc(cart.ticket)}</span><button type="button" data-tkrm>Quitar</button></div>`:'';
}
function setTicket(f){
  if(cart.ticketUrl){try{URL.revokeObjectURL(cart.ticketUrl)}catch(e){}}
  cart.file=f||null;cart.ticket=f?f.name:'';cart.ticketUrl='';
  if(f){try{cart.ticketUrl=URL.createObjectURL(f)}catch(e){}}

}
let supMap={};
function supLoad(){try{supMap=JSON.parse(localStorage.getItem('adv_ops_sup')||'{}')||{}}catch(e){supMap={}}}
function supSave(){try{localStorage.setItem('adv_ops_sup',JSON.stringify(supMap))}catch(e){}}
// Proveedor: se rellena con el último usado para ese producto, mientras la persona no lo haya escrito
function applySup(){
  if(cart.supTouched)return;const el=$('sSup');if(!el)return;
  const v=supFor(supMap,cart.lines.filter(l=>l.i).map(l=>l.i));if(v)el.value=v;

function openCompra(pre){
  supLoad();

  sheet('Gasto / Compra',`<div class="tkrow"><label>📷 <span id="tkName">Ticket (opcional)</span><input id="tkFile" type="file" accept="image/*" hidden></label></div><div id="tkBox"></div>

    <div class="group"><div class="list">
      <div class="field"><label for="sDate">Fecha</label><input id="sDate" type="date" value="${TODAY}"></div>
      <div class="field" id="hastaF" hidden><label for="sHasta">Cubre hasta<div class="s">Fruta: último día que alcanza</div></label><input id="sHasta" type="date"></div>
      <div class="field"><label for="sSup">Proveedor</label><input id="sSup" placeholder="Opcional" autocomplete="off"></div>
      <div class="field" id="noteF" hidden><label for="sNote">Nota</label><input id="sNote" placeholder="Opcional"></div>
      <button type="button" class="addnote" data-addnote>Agregar nota</button></div></div>

function cartInput(e){
  const t=e.target;
  if(t.id==='tkFile'){const f=t.files&&t.files[0]||null;if(f!==cart.file)setTicket(f);return}
  if(t.id==='sSup'){cart.supTouched=true;return}
  const l=cart.lines[+t.dataset.k];if(!l)return;
  if(t.classList.contains('cQ'))l.qty=Math.max(0,+t.value||0);
  else if(t.classList.contains('cK')){l.pack=Math.max(1,+t.value||1);setPref(l)}
  else if(t.classList.contains('cP'))l.price=Math.max(0,+t.value||0);
  else return;
  updateTotals();
}
// Foto del ticket: se reduce en el teléfono (máx. 1000 px, JPEG) y el servidor la guarda en Drive
function shrink(file){return new Promise(res=>{try{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{try{const k=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.7))}catch(e){res('')}};
  img.onerror=()=>{URL.revokeObjectURL(url);res('')};img.src=url}catch(e){res('')}})}
async function saveCompra(){
  const ls=cart.lines.filter(l=>units(l)>0);if(!ls.length||saving)return;
  const okb=$('sheetOk');if(okb)okb.disabled=true;
  const sup=$('sSup').value.trim()||'Sin proveedor',d=$('sDate').value||TODAY,note=$('sNote').value.trim(),hasta=$('sHasta')?$('sHasta').value:'';
  const payload={d,sup,note,hasta:ls.some(l=>l.i==='fru')?hasta:'',ticket:cart.ticket,lines:ls.map(l=>({i:l.i,q:units(l),p:l.price}))};
  if(cart.file)payload.ticketData=await shrink(cart.file);
  ls.forEach(setPref);
  const r=await act('addCompra',[payload]);
  if(r){supMap=supRemember(supMap,ls.map(l=>l.i),sup);supSave();closeSheet();render();toast('Registrado')}
}

  const diffs=ctlItems().filter(i=>counts[i.id]!==undefined&&+counts[i.id]!==stock(i.id)).map(i=>({it:i,sys:stock(i.id),cnt:+counts[i.id]}));
  if(!diffs.length){closeSheet();toast('Todo coincide');return}
  sheet('Revisar diferencias',`<div class="group"><div class="ghead">Diferencias</div><div class="list">${diffs.map(d=>{const df=d.cnt-d.sys,sev=Math.abs(df)>=Math.max(1,d.sys*.1)?'red':'orange';return `<div class="cell w-${sev}"><span class="ic">⚠️</span><span class="main"><span class="t">${d.it.icon} ${esc(d.it.name)}</span><div class="s">Sistema ${num(d.sys)} → Conteo ${num(d.cnt)} (${sg(df)})</div></span></div>`}).join('')}</div></div>
    <div class="group"><div class="ghead">Nota (obligatoria)</div>${noteBox('iNote','Por qué cambia el inventario')}<div class="gfoot">Esto reescribe el stock actual. Se guarda un ajuste por producto en el historial.</div></div>
    <div class="stack"><button class="btn" id="iGo" disabled>Confirmar y reescribir inventario</button></div>`,
    {back:{label:'Conteo',fn:invStep1},input:()=>{$('iGo').disabled=!$('iNote').value.trim()}});
  $('iGo').onclick=async()=>{const note=$('iNote').value.trim();if(!note)return;$('iGo').disabled=true;
    const r=await act('addConteo',[{d:TODAY,counts:counts,nota:note}]);
    if(r){counts={};closeSheet();render();toast(`Inventario reescrito (${r.n} ${r.n===1?'producto':'productos'})`)}else $('iGo').disabled=false};

  $('aHint').style.color=v!==''&&df!==0?'var(--orange)':'';
  $('sheetOk').disabled=!(v!==''&&df!==0&&$('aNote').value.trim());

async function saveAjuste(){

const revAt=r=>r.day&&r.day!==TODAY?fdate(r.day)+' '+r.hm:(r.hm||r.at||'');
const nowKey=()=>TODAY+' '+NOW;
let bitOpen=null; // salida cuya tabla de bitácora está abierta
const BIT_T={done:['ok','Hecha'],late:['late','Falta'],wait:['','Por hacer']};
// Bitácora: UNA sola sección con Ida y Regreso lado a lado (punto + estado). Al tocar se abre la tabla de productos.
// Costos adicionales: cada renglón leído del texto (etiqueta + monto); lo que no tiene monto se muestra tal cual con aviso
function caRows(d){
  if(!caHas(d))return '';const ca=d.ca;
  const lines=ca.items.map(x=>`<div class="sn">${x.ext?'<span class="rb">Ext.</span>':''}${esc(x.label||'Costo adicional')} · ${fmt(x.amount)}</div>`).join('');
  const warn=ca.unparsed?`<div class="s" style="color:var(--orange)">⚠️ Sin monto: ${esc(ca.rest.join(' · '))}</div>`:'';
  return `<div class="cell"><span class="main"><span class="t">Costos adicionales</span>${lines}${warn}</span>${ca.items.length?`<span class="v">${fmt(ca.total)}</span>`:''}</div>`;
}
function bitSection(d,fut){
  const bp=bitParts(d,nowKey()),avUrl=d.itemPk?fhAvailUrl(d.itemPk,d.id,d.date):'';
  if(bp.na)return `<div class="group">${gh('bitacora','Bitácora')}<div class="list"><div class="cell c"><span class="main t mut">No aplica</span></div></div></div>`;
  // ↗ junto a Ida y Regreso: abre esa reserva OPS en FareHarbor; si no existe, gris y lleva a la salida
  const lnk=(url,l)=>url?fhA(fhBookUrl(url,d.date),'',{label:'Abrir la bitácora de '+l.toLowerCase()+' en FareHarbor'}):avUrl?fhA(avUrl,'',{gray:true,label:'Falta la reserva de '+l.toLowerCase()+': abrir la salida en FareHarbor'}):'';
  const part=(l,k,url)=>`<span class="bpart"><i class="bdot ${BIT_T[k][0]}"></i><span><b>${l}</b><small>${BIT_T[k][1]}</small></span>${lnk(url,l)}</span>`;
  const has=!!(d.out||d.back),open=has&&bitOpen===d.id;
  let h=`<div class="group">${gh('bitacora','Bitácora')}<div class="list">`;
  h+=`<div class="cell bitrow">${part('Ida',bp.ida,d.salidaUrl)}${part('Regreso',bp.reg,d.regresoUrl)}${has?`<button type="button" class="bx" data-bitx="${d.id}" aria-expanded="${open}" aria-label="Ver productos de la bitácora">${chev}</button>`:''}</div>`;
  if(open){
    const out=d.out||{},back=d.back||{},ids=S.items.filter(i=>out[i.id]!==undefined||back[i.id]!==undefined);
    const rows=ids.map(it=>{const i=it.id,o=out[i]||0,bev=it.group==='Bebidas',bk=bev?(d.back?(back[i]||0):null):0;
      const used=!d.out?null:bev?(d.back?Math.max(0,o-bk):null):o;
      return `<div class="trow c"><span>${esc(it.name)}</span><span>${d.out&&o?num(o):'—'}</span><span>${bev?(bk===null?'…':num(bk)):'—'}</span><span>${used===null?'…':(used?num(used):'—')}</span><span>${used===null?'…':(used?fmt(used*it.price):'—')}</span></div>`}).join('');
    h+=`<div class="trow c th"><span>Producto</span><span>Salió</span><span>Regresó</span><span>Usado</span><span>Costo</span></div>${rows||'<div class="empty">Sin productos anotados.</div>'}
      <div class="cell c"><span class="main t">Extras a bordo</span><span class="v" style="white-space:normal;max-width:55%">${d.extras?esc(d.extras):'Ninguno'}</span></div>
      <div class="cell c"><span class="main t">Hora extra</span><span class="v">${d.hx} ${d.hx===1?'hora':'horas'}</span></div>`;
  }
  return h+'</div></div>';
}
const BOAT_I='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M12 4.5l6 9.5h-6"/><path d="M12 8L7 14h5"/><path d="M4 17.5h16l-2.2 3.2H6.2z"/></svg>';
// Tarjeta de salida: cuadrícula con áreas fijas (hora · nombre+bruto · recursos+neto · tripulación · conteo) y una franja de bitácora abajo.
// Cada dato siempre en el mismo lugar: más tripulación o recursos solo hacen la tarjeta más alta.
function depCard(d,sec){
  const st=status(d),n=netOf(d),miss=missingRole(d),fut=st==='prog',est=d.netSource==='estimado',bp=bitParts(d,nowKey());
  const first=x=>String(x||'').trim().split(/\s+/)[0];
  const crew=d.crew.map(x=>`${x.ext?'Ext.':x.r?esc(rb(x.r)):'<span class="wq">?</span>'} ${esc(first(x.n))}`).join(' · ');
  const res=(d.res||[]).map(r=>esc(r.name)).join(' · ');
  const rent=isRenta(d);
  const dot=(l,k)=>`<span class="bd"><i class="bdot ${BIT_T[k][0]}"></i>${l}<span class="sr">${BIT_T[k][1]}</span></span>`;
  const bits=bp.na?'<span class="bd">No aplica</span>':`<span class="bds">${dot('Ida',bp.ida)}${dot('Regreso',bp.reg)}</span>`;
  const an=depAlertN(d,nowKey()),nores=noRes(d);
  let tags='';
  if(an)tags+=`<span class="tg w" aria-label="${an} ${an===1?'aviso':'avisos'}">⚠️ ${an}</span>`;
  // Revisión: solo un ícono. Amarillo = el día ya terminó y nadie la marcó; verde = revisada. Hoy y días futuros: nada.
  if(d.rev)tags+=`<span class="ri ok" role="img" aria-label="Revisado">${svgI('check',18)}</span>`;
  else if(needsReview(d,TODAY))tags+=`<span class="ri" role="img" aria-label="Por revisar">${svgI('clock',18)}</span>`;
  const nb=d.bookings.length;
  return `<div class="dcard${sec?' '+sec:''}"><button class="dmain r3" data-dep="${d.id}"><div class="dg">
    <span class="hr">${d.time}</span><span class="chv">${chev}</span>
    <span class="tn">${esc(d.item)}${d.label?` <span class="lbl">· ${esc(d.label)}</span>`:''}</span><span class="mon">${money2(d.gross,fut?undefined:n,est)}</span>
    <span class="rs">${res?BOAT_I+res:nores?'<span class="nores">⚠️ Sin recurso</span>':''}</span>
    <span class="cw">${crew?svgI('crew',14)+'<span>'+crew+'</span>':rent?'–':'Sin tripulación'}</span>
    <span class="ct">${nb} ${nb===1?'booking':'bookings'} · ${personasTxt(paxOf(d))}</span></div>
    <div class="dstrip"><span class="lb">Bitácora</span>${bits}<span class="tgs">${tags}</span></div></button></div>`;
}

let pc=null;
const pcValid=()=>{if(!pc)return false;const v=pc.v;
  if(pc.p.kind==='item')return !!(v.tipo&&v.barco&&v.bit);
  if(pc.p.kind==='rol')return !!v.main&&(v.main!=='otro'||!!v.otro.trim());
  return !!v.main};
const pcChips=(g,opts,cur,cls)=>`<div class="${cls}" role="group">${opts.map(([k,l])=>`<button type="button" class="${cls==='chips'?'chip':''}" data-pc="${g}:${esc(k)}" aria-pressed="${cur===k}">${esc(l)}</button>`).join('')}</div>`;
function openPend(i){
  const p=S.pend[i];if(!p||!can('config'))return;
  const a=p.actual||{},v={main:'',otro:'',tipo:'',barco:'',bit:'',fld:[]};
  if(p.kind==='tipo')v.main=a.uso;
  else if(p.kind==='campo')v.main=a.uso==='producto'?'p:'+a.prod:a.uso;
  else if(p.kind==='rol'){const k=ROL_O.some(x=>x[0]===a.tarifa);v.main=k?a.tarifa:'otro';v.otro=k?'':(a.tarifa||'')}
  else{v.tipo=a.tipo||'';v.barco=a.barco||'';v.bit=a.bitacora||'no';v.fld=(a.fields||[]).slice()}
  pc={p,v};
  const info=`<div class="group"><div class="list"><div class="cell"><span class="main"><span class="t">${esc(p.name||'(sin nombre)')}</span><div class="s">${p.pk?'pk '+esc(p.pk)+' · ':''}visto ${esc(p.visto?fdt(p.visto):'—')}${p.en?' · '+esc(p.en):''}</div>${p.ejemplo?`<div class="s">Ejemplo: ${esc(p.ejemplo)}</div>`:''}</span></div></div></div>`;
  let body='';
  if(p.kind==='tipo')body=`<div class="group"><div class="ghead">¿Qué es?</div>${pcChips('main',USO_T,v.main,'chipsel')}</div>`;
  else if(p.kind==='campo'){
    const prods=S.items.filter(x=>x.active).map(x=>['p:'+x.id,x.icon+' '+x.name]);
    body=`<div class="group"><div class="ghead">¿Qué es?</div>${pcChips('main',prods.concat(USO_C),v.main,'chipsel')}</div>`}
  else if(p.kind==='rol')
    body=`<div class="group"><div class="ghead">¿Qué rol es para la tarifa?</div>${pcChips('main',ROL_O.concat([['otro','Otro…']]),v.main,'chipsel')}</div>
      <div class="group" id="pcOtroBox" ${v.main==='otro'?'':'hidden'}><div class="list"><div class="field"><label for="pcOtro">Rol en Tarifas</label><input id="pcOtro" placeholder="Ej. instructor" value="${esc(v.otro)}"></div></div><div class="gfoot">Debe coincidir con la columna Rol de la hoja Tarifas.</div></div>`;
  else{
    const cs=(p.opciones&&p.opciones.campos)||[];
    body=`<div class="group"><div class="ghead">Tipo de tour</div>${pcChips('tipo',TIPOS_T,v.tipo,'chips')}</div>
      <div class="group"><div class="ghead">Tipo de barco</div>${pcChips('barco',TYPES,v.barco,'chips')}</div>
      <div class="group"><div class="ghead">¿Lleva bitácora?</div>${pcChips('bit',[['sí','Sí'],['no','No']],v.bit,'chips')}</div>
      <div class="group" id="pcFld" ${v.tipo==='privado'||v.tipo==='renta'?'':'hidden'}><div class="ghead">Campo de personas</div>${cs.length?`<div class="chips" role="group">${cs.map(c=>`<button type="button" class="chip" data-pc="fld:${esc(c.pk)}" aria-pressed="${v.fld.indexOf(String(c.pk))>=0}">${esc(c.name)} · ${esc(c.pk)}${c.ejemplo?' ('+esc(c.ejemplo)+')':''}</button>`).join('')}</div>`:'<div class="list"><div class="empty">No vi campos en las reservas de este tour.</div></div>'}
        <div class="gfoot">Para tours privados o rentas: el campo que dice cuántas personas son.</div></div>`}
  sheet(PEND_TITLE[p.kind],info+body,{ok:savePend,okLabel:'Guardar',disabled:!pcValid(),input:()=>{const o=$('pcOtro');if(o&&pc)pc.v.otro=o.value;$('sheetOk').disabled=!pcValid()}});
}
function paintPc(){
  if(!pc)return;const v=pc.v;
  document.querySelectorAll('#sheetRoot [data-pc]').forEach(b=>{const i=b.dataset.pc.indexOf(':'),g=b.dataset.pc.slice(0,i),k=b.dataset.pc.slice(i+1);
    b.setAttribute('aria-pressed',g==='fld'?v.fld.indexOf(k)>=0:v[g]===k)});
  const ob=$('pcOtroBox');if(ob)ob.hidden=v.main!=='otro';
  const fb=$('pcFld');if(fb)fb.hidden=!(v.tipo==='privado'||v.tipo==='renta');
  $('sheetOk').disabled=!pcValid();
}
async function savePend(){
  if(!pc||!pcValid()||!can('config'))return;
  const {p,v}=pc;let val;
  if(p.kind==='tipo')val={uso:v.main};
  else if(p.kind==='campo')val=v.main.indexOf('p:')===0?{uso:'producto',prod:v.main.slice(2)}:{uso:v.main};
  else if(p.kind==='rol')val={tarifa:v.main==='otro'?v.otro.trim():v.main};
  else val={tipo:v.tipo,barco:v.barco,fields:(v.tipo==='privado'||v.tipo==='renta')?v.fld.join(','):'',bitacora:v.bit};
  const r=await act('setMapeo',[p.kind,p.clave,val]);
  if(r){closeSheet();pc=null;render();toast('Guardado. Recalculando historial…')}
}
// ===== PIN =====
let pinBuf='';
function paintPin(){document.querySelectorAll('#pDots i').forEach((x,k)=>x.classList.toggle('on',k<pinBuf.length))}
function showPin(msg){
  pinBuf='';$('boot').hidden=true;$('pin').hidden=false;paintPin();
  const m=$('pMsg');m.textContent=msg||'Ingresa tu PIN';m.className='lede'+(msg?' err':'');
  if(msg){const d=$('pDots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}
}
function logout(msg){
  PIN='';try{localStorage.removeItem('adv_ops_pin')}catch(e){}
  cacheClear();S.date='';S.wk='';S.role='op';tab='op';stackView=null;closeSheet();$('app').innerHTML='';showPin(msg||'');
}
async function pinKey(k){
  if($('pin').hidden||saving)return;
  if(k==='del'){pinBuf=pinBuf.slice(0,-1);paintPin();return}
  if(pinBuf.length>=4)return;
  pinBuf+=k;paintPin();
  if(pinBuf.length===4){const p=pinBuf;await tryLogin(p,false)}
}
async function tryLogin(pin,remembered){
  setBusy(1);
  try{
    const r=await API('login',pin);
    if(!r||!r.ok){setBusy(-1);if(remembered){try{localStorage.removeItem('adv_ops_pin')}catch(e){}}showPin(r&&r.error?r.error:'PIN incorrecto');return false}
    PIN=pin;S.perms=r.perms;S.realRole=r.rol;S.role=r.rol;S.user=r.nombre;
    try{localStorage.setItem('adv_ops_pin',pin)}catch(e){}
    $('pMsg').textContent='Cargando…';
    try{await load('','')}catch(e){setBusy(-1);bootError(errMsg(e));return false}
    setBusy(-1);$('pin').hidden=true;$('boot').hidden=true;tab='op';stackView=null;render();return true;
  }catch(e){setBusy(-1);bootError(errMsg(e));return false}
}
function bootError(m){
  $('pin').hidden=true;$('boot').hidden=false;
  $('boot').innerHTML=`<div><div class="logo" style="font-size:40px">⚠️</div><p>${esc(m)}</p><button class="btn" id="bootRetry">Reintentar</button></div>`;
  $('bootRetry').onclick=()=>{$('boot').innerHTML='<div>Cargando…</div>';start()};
}
function start(){
  let pin='';try{pin=localStorage.getItem('adv_ops_pin')||''}catch(e){}
  if(!pin){showPin();return}
  PIN=pin;
  const c=cacheRead(pin,'','');
  if(c){ // se pinta al instante con lo último que había; lo nuevo llega enseguida
    const a=advanceClock(c.d.today,c.d.now,Date.now()-c.at);
    applyData(Object.assign({},c.d,{today:a.today,now:a.now}),c.at);
    $('pin').hidden=true;$('boot').hidden=true;tab='op';stackView=null;render();
    setBusy(1,true);load('','').then(()=>softRender()).catch(e=>{S.offline=/Sin conexión/.test(errMsg(e));paintStatus();if(PIN)toast(S.offline?'Sin conexión. Mostrando los últimos datos.':errMsg(e),'err')}).finally(()=>setBusy(-1,true));
    return;
  }
  setBusy(1);
  load('','').then(()=>{setBusy(-1);$('pin').hidden=true;$('boot').hidden=true;tab='op';stackView=null;render()})
    .catch(e=>{setBusy(-1);if(PIN)bootError(errMsg(e))}); // PIN incorrecto → srv ya llamó logout()
}

// ===== Render + events =====
function render(){
  const app=$('app');
  try{app.innerHTML=roleBar()+(stackView?V[stackView.name](stackView.arg):V[tab]())}
  catch(err){app.innerHTML=roleBar()+`<div class="warn">No pude mostrar esta pantalla: ${esc(err.message)}</div>`;console.warn(err)}
  document.querySelectorAll('.tab').forEach(b=>b.dataset.tab===tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  const mb=document.querySelector('.tab[data-tab="mas"]');
  if(mb){let bd=mb.querySelector('.bdg');const n=pendN();
    if(n){if(!bd){bd=document.createElement('span');bd.className='bdg';mb.appendChild(bd)}bd.textContent=n;mb.setAttribute('aria-label','Más, '+n+' por configurar')}
    else{if(bd)bd.remove();mb.removeAttribute('aria-label')}}
  const q=$('q');if(q)q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;render();const n=$('q');n.focus();n.setSelectionRange(pos,pos)};
}
const goTop=()=>window.scrollTo(0,0);
// Cambiar de día o semana nunca espera al servidor: se pinta ya y, si falta rango, llega en segundo plano
function setDate(d){S.date=d;const p=(d<S.win.from||d>S.win.to)?ensureRange(d,d):null;render();if(p)p.then(softRender)}
function setWk(ws){S.wk=ws;const p=(ws<S.win.from||addD(ws,6)>S.win.to)?ensureRange(ws,addD(ws,6)):null;render();if(p)p.then(softRender)}
async function calMonth(){
  const a=cal.y+'-'+String(cal.m+1).padStart(2,'0')+'-01',b=cal.y+'-'+String(cal.m+1).padStart(2,'0')+'-'+String(new Date(cal.y,cal.m+1,0).getDate()).padStart(2,'0');
  openCal();if(a<S.win.from||b>S.win.to)ensureRange(a,b).then(()=>{if($('sheetRoot').querySelector('.cal'))openCal();else softRender()});
}
document.addEventListener('focusout',()=>setTimeout(flushRender,0));
document.addEventListener('input',e=>{if(inFn)inFn(e)});
document.addEventListener('change',e=>{if(inFn)inFn(e)});
document.addEventListener('keydown',e=>{
  if($('pin').hidden)return;
  if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('del');
});
// Al volver a la app, o cada 2 minutos, se actualizan los datos (si no hay un formulario abierto)
function autoRefresh(){
  if(!PIN||saving||document.hidden||$('sheetRoot').innerHTML||Date.now()-lastLoad<60000)return;
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  lastLoad=Date.now();refresh(true);
}
document.addEventListener('visibilitychange',()=>{autoRefresh();paintStatus()});setInterval(autoRefresh,120000);setInterval(paintStatus,60000);setInterval(tickClock,60000);
document.addEventListener('click',e=>{
  const t=e.target,on=s=>t.closest(s);
  if(on('a[href]'))return; // enlaces a FareHarbor: los abre el navegador (pestaña nueva)
  // PIN pad
  const pk=on('[data-pk]');if(pk){pinKey(pk.dataset.pk);return}
  // Sheet layer
  if(on('#sheetRoot')){
    if(t.matches('[data-scrim]')||on('[data-close]')){closeSheet();return}
    const m=on('[data-m]');if(m){const k=m.dataset.m,pre=menuPre;closeSheet();
      if(k==='inv'){counts={};invStep1()}else if(k==='aj')openAjuste(pre);else if(k==='edit')openEditCompra(pre);else if(k==='anul')openAnular(pre);return}
    if(on('[data-addp]')){cart.lines.push(emptyLine());renderCart();const li=document.querySelector(`.li[data-k="${cart.lines.length-1}"]`);if(li)li.scrollIntoView({block:'nearest'});return}
    const tr=on('[data-tkrm]');if(tr){setTicket(null);const f=$('tkFile');if(f)f.value='';return}
    const cg=on('[data-chg]');if(cg){const l=cart.lines[+cg.dataset.chg];l.choosing=!l.choosing;renderCart();return}
    const ch=on('[data-chip]');if(ch){const[k,id]=ch.dataset.chip.split(':'),old=cart.lines[+k];if(old.i!==id)cart.lines[+k]=newLine(id);else old.choosing=false;renderCart();applySup();return}
    const an=on('[data-addnote]');if(an){an.hidden=true;$('noteF').hidden=false;$('sNote').focus();return}
    const ico=on('[data-ico]');if(ico&&!pe.ro){pe.icon=ico.dataset.ico;document.querySelectorAll('[data-ico]').forEach(b=>b.setAttribute('aria-pressed',b===ico));return}
    const asw=on('[data-actsw]');if(asw&&!pe.ro){pe.act=!pe.act;asw.setAttribute('aria-checked',pe.act);return}
    const rm=on('[data-rm]');if(rm){cart.lines.splice(+rm.dataset.rm,1);renderCart();return}
    const md=on('[data-mode]');if(md){const[k,m2]=md.dataset.mode.split(':'),l=cart.lines[+k];
      if(l.mode!==m2){l.qty=m2==='unidad'?r2(l.qty*l.pack):r2(l.qty/l.pack);l.mode=m2;setPref(l);renderCart()}return}
    const st=on('[data-step]');if(st){const[k,d]=st.dataset.step.split(':'),l=cart.lines[+k];l.qty=Math.max(0,r2(l.qty+(+d)));
      document.querySelector(`.cQ[data-k="${k}"]`).value=l.qty||'';updateTotals();return}
    const ct=on('[data-ctl]');if(ct&&!pe.ro){pe.ctl=!pe.ctl;ct.setAttribute('aria-checked',pe.ctl);
      document.querySelectorAll('[data-only="stock"]').forEach(x=>x.hidden=!pe.ctl);
      $('ctlHint').textContent=(pe.ctl?'Se guarda en bodega y se descuenta con la bitácora.':'Se paga al usarlo y no se guarda en bodega. Solo se registra el costo.')+(pe.id?' Los productos inactivos no aparecen en el stock ni en las compras.':'');return}
    const cn=on('[data-calnav]');if(cn){cal.m+=+cn.dataset.calnav;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}calMonth();return}
    const cd=on('[data-calday]');if(cd){S.date=cd.dataset.calday;stackView=null;tab='op';closeSheet();render();goTop();return}
    const pcb=on('[data-pc]');if(pcb&&pc){const x=pcb.dataset.pc,i=x.indexOf(':'),g=x.slice(0,i),val=x.slice(i+1);
      if(g==='fld'){const k=pc.v.fld.indexOf(val);if(k>=0)pc.v.fld.splice(k,1);else pc.v.fld.push(val)}else pc.v[g]=val;
      paintPc();return}
    const tt=on('[data-tt]');if(tt){if(can('config')){(async()=>{const r=await act('saveTourBarco',[tt.dataset.ttn,tt.dataset.tt]);if(r){closeSheet();render();toast('Tipo de barco guardado')}})()}return}
    return;
  }
  const rs=on('[data-rolesw]');if(rs){S.role=rs.dataset.rolesw;render();return}
  const b=on('[data-tab]');if(b){tab=b.dataset.tab;stackView=null;render();goTop();return}
  const bk=on('[data-back]');if(bk){if(bk.dataset.back)tab=bk.dataset.back;stackView=bk.dataset.backview?{name:bk.dataset.backview}:null;render();goTop();return}
  const vw=on('[data-view]');if(vw){stackView={name:vw.dataset.view};render();goTop();return}
  const mv=on('[data-movs]');if(mv){stackView={name:'movs'};render();goTop();return}
  const ed=on('[data-edit]');if(ed){openProducto(ed.dataset.edit);return}
  const go=on('[data-go]');if(go){tab=go.dataset.go;stackView=null;render();goTop();return}
  const it=on('[data-item]');if(it){stackView={name:'item',arg:it.dataset.item};render();goTop();return}
  const pu=on('[data-purchase]');if(pu){stackView={name:'purchase',arg:pu.dataset.purchase};render();goTop();return}
  const rv=on('[data-roleview]');if(rv){stackView={name:'role',arg:rv.dataset.roleview};render();goTop();return}
  const pm=on('[data-perm]');if(pm){const[r,p]=pm.dataset.perm.split(':');
    if(can('config')&&!(r==='admin'&&p==='config')){const cur=!!S.perms[r][p];S.perms[r][p]=!cur;render();
      srv('savePerm',r,p,!cur).catch(er=>{S.perms[r][p]=cur;render();toast(errMsg(er),'err')})}return}
  if(on('[data-logout]')){logout();return}
  if(on('[data-refresh]')){refresh();return}
  if(on('[data-fopen]')){S.fopen=!S.fopen;render();return}
  const fl=on('[data-filter]');if(fl){S.filter=depFilter(fl.dataset.filter).key;S.fopen=false;try{localStorage.setItem('adv_ops_depfilter',S.filter)}catch(e){}render();return}
  if(on('[data-today]')){setDate(TODAY);return}
  const bx=on('[data-bitx]');if(bx){bitOpen=bitOpen===bx.dataset.bitx?null:bx.dataset.bitx;render();return}
  const dy=on('[data-day]');if(dy){setDate(addD(S.date,+dy.dataset.day));return}
  if(on('[data-cal]')){cal={y:pd(S.date).getFullYear(),m:pd(S.date).getMonth()};calMonth();return}
  const rv2=on('[data-rev]');if(rv2){doRev(rv2.dataset.rev);return}
  const dp=on('[data-dep]');if(dp){stackView={name:'dep',arg:dp.dataset.dep};render();goTop();return}
  const wk=on('[data-wk]');if(wk){setWk(addD(S.wk,7*(+wk.dataset.wk)));return}
  const pe2=on('[data-person]');if(pe2){stackView={name:'person',arg:pe2.dataset.person};render();goTop();return}
  const py=on('[data-pay]');if(py){doPaid(py.dataset.pay);return}
  const rt=on('[data-rate]');if(rt){openRate(rt.dataset.rate);return}
  const tr2=on('[data-tour]');if(tr2){openTour(tr2.dataset.tour);return}
  const pd2=on('[data-pend]');if(pd2){openPend(+pd2.dataset.pend);return}
  const a=on('[data-act]');if(!a)return;const act2=a.dataset.act,pre=a.dataset.pre;
  if(act2==='compra'&&can('compras'))openCompra(pre);
  if(act2==='addprod'&&can('config'))openProducto();
  if(act2==='menu'&&menuOk())openMenu(pre);
  if(act2==='pmenu'&&can('editar'))openPMenu(pre);
});
start();
})();
</script>
</body>
</html>
